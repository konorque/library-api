<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Books API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        input { display: block; margin: 8px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 16px; cursor: pointer; }
        #books-list div { padding: 6px 0; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Список книг</h1>
    <p><a href="/api-tester.html">Открыть API Tester →</a></p>
    <div id="books-list"></div>

    <h2>Добавить книгу</h2>
    <input id="title-input" placeholder="Название">
    <input id="author-input" placeholder="Автор">
    <button id="add-btn">Добавить книгу</button>

    <script>
        async function loadBooks() {
            const response = await fetch('/books');
            const books = await response.json();

            const list = document.getElementById('books-list');
            list.innerHTML = '';

            books.forEach(book => {
                const div = document.createElement('div');
                div.textContent = book.title + ' — ' + book.author;
                list.appendChild(div);
            });
        }

        document.getElementById('add-btn').addEventListener('click', async () => {
            const title = document.getElementById('title-input').value;
            const author = document.getElementById('author-input').value;

            if(!title || !author)
            return alert('Fill all the fields');

            await fetch('/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, author: author })
            });

            document.getElementById('title-input').value = '';
            document.getElementById('author-input').value = '';
            loadBooks();
        });

        loadBooks();
    </script>
</body>
</html>
