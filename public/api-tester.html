<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>API Tester — Books</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
        h1 { font-size: 20px; }
        section { border: 1px solid #ccc; border-radius: 8px; padding: 14px; margin-bottom: 16px; }
        h2 { font-size: 15px; margin-top: 0; }
        input { padding: 6px; margin: 4px 6px 4px 0; width: 220px; box-sizing: border-box; }
        button { padding: 6px 12px; cursor: pointer; }
        pre { background: #111; color: #0f0; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
        .status { font-weight: bold; margin-right: 8px; }
        .status.ok { color: green; }
        .status.err { color: #c00; }
    </style>
</head>
<body>
    <h1>API Tester — /books</h1>
    <p>Служебная страница для тестирования бэкенда.</p>

    <section>
        <h2>GET /books — получить все книги</h2>
        <button onclick="getAll()">Отправить GET /books</button>
        <pre id="out-getAll">—</pre>
    </section>

    <section>
        <h2>GET /books/:id — получить одну книгу</h2>
        <input id="getId" placeholder="id книги">
        <button onclick="getOne()">Отправить GET /books/:id</button>
        <pre id="out-getOne">—</pre>
    </section>

    <section>
        <h2>POST /books — создать книгу</h2>
        <input id="postTitle" placeholder="title">
        <input id="postAuthor" placeholder="author">
        <button onclick="createBook()">Отправить POST /books</button>
        <pre id="out-post">—</pre>
    </section>

    <section>
        <h2>PUT /books/:id — обновить книгу</h2>
        <input id="putId" placeholder="id книги">
        <input id="putTitle" placeholder="title (необязательно)">
        <input id="putAuthor" placeholder="author (необязательно)">
        <button onclick="updateBook()">Отправить PUT /books/:id</button>
        <pre id="out-put">—</pre>
    </section>

    <section>
        <h2>DELETE /books/:id — удалить книгу</h2>
        <input id="deleteId" placeholder="id книги">
        <button onclick="deleteBook()">Отправить DELETE /books/:id</button>
        <pre id="out-delete">—</pre>
    </section>

    <script>
        async function show(outputId, promise) {
            const out = document.getElementById(outputId);
            out.textContent = 'Отправляю запрос...';
            try {
                const response = await promise;
                let body;
                try { body = await response.json(); } catch (e) { body = '(пустой или не-JSON ответ)'; }
                const statusClass = response.ok ? 'ok' : 'err';
                out.innerHTML = '<span class="status ' + statusClass + '">' + response.status + ' ' + response.statusText + '</span>\n' + JSON.stringify(body, null, 2);
            } catch (e) {
                out.textContent = 'Сетевая ошибка: ' + e.message;
            }
        }

        function getAll() {
            show('out-getAll', fetch('/books'));
        }

        function getOne() {
            const id = document.getElementById('getId').value.trim();
            show('out-getOne', fetch('/books/' + id));
        }

        function createBook() {
            const title = document.getElementById('postTitle').value;
            const author = document.getElementById('postAuthor').value;
            show('out-post', fetch('/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, author: author })
            }));
        }

        function updateBook() {
            const id = document.getElementById('putId').value.trim();
            const title = document.getElementById('putTitle').value;
            const author = document.getElementById('putAuthor').value;
            const payload = {};
            if (title) payload.title = title;
            if (author) payload.author = author;
            show('out-put', fetch('/books/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }));
        }

        function deleteBook() {
            const id = document.getElementById('deleteId').value.trim();
            show('out-delete', fetch('/books/' + id, { method: 'DELETE' }));
        }
    </script>
</body>
</html>
